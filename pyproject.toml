[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kairos"
version = "0.1.0"
description = "Local-first goal, life, and focus tracker."
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.8,<7",
]

[project.scripts]
kairos = "kairos.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

